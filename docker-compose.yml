# Windows-friendly variant of the teacher's 3-service Compose project.
# Windows Student API already occupies host port 3000.
# Explicit project name protects the separate Lab 7 configs Compose stack.
name: lab8-cd

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-lab8-app:latest
    container_name: lab8-app
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: lab8-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: lab8-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
